<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue circular background -->
  <circle cx="100" cy="100" r="100" fill="#00A9CE"/>

  <!-- House icon -->
  <g transform="translate(100, 70)">
    <!-- Roof -->
    <polygon points="0,-35 -40,-5 40,-5" fill="white"/>
    <!-- House body -->
    <rect x="-35" y="-5" width="70" height="45" fill="none" stroke="white" stroke-width="3"/>
    <!-- Door -->
    <rect x="-12" y="15" width="24" height="25" fill="none" stroke="white" stroke-width="2"/>
    <!-- Door handle -->
    <circle cx="10" cy="27" r="2" fill="white"/>
    <!-- Checklist -->
    <g transform="translate(-18, -18)">
      <line x1="0" y1="0" x2="8" y2="0" stroke="white" stroke-width="2"/>
      <line x1="0" y1="8" x2="8" y2="8" stroke="white" stroke-width="2"/>
      <line x1="0" y1="16" x2="8" y2="16" stroke="white" stroke-width="2"/>
    </g>
  </g>

  <!-- Arrow pointing right -->
  <g transform="translate(50, 115)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="white" stroke-width="4"/>
    <polygon points="50,0 40,-6 40,6" fill="white"/>
  </g>

  <!-- Second arrow -->
  <g transform="translate(85, 115)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="white" stroke-width="3"/>
    <polygon points="35,0 28,-4 28,4" fill="white"/>
  </g>

  <!-- Text: INSPECTION EXPRESS -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">INSPECTION</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">EXPRESS</text>
</svg>